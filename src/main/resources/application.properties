# App name (good to keep)
spring.application.name=NeuronNote

# PostgreSQL DB connection
spring.datasource.username=bsc
spring.datasource.password=1234
spring.datasource.url=jdbc:postgresql://localhost:5432/flashmind_db
    # Leave blank if no password required

# JPA (Hibernate) config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port (optional, 8080 is default)
# server.port=8080
